name: RadioResolve Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release/build version suffix
        required: true
        default: 0.6.2-beta-1-radioresolve-1
      create_release:
        description: Create a GitHub release
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - radioresolve-call-timing
    tags:
      - radioresolve-*

permissions:
  contents: write

jobs:
  radioresolve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: liberica
          java-package: jdk+fx

      - name: Select build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#radioresolve-}"
          else
            VERSION="0.6.2-beta-1-radioresolve-branch"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=radioresolve-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using projectVersion=${VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux and Mac release zips
        run: ./gradlew runtimeZipOthers -PprojectVersion=${{ steps.version.outputs.version }}

      - name: Build Windows release zips
        run: ./gradlew runtimeZipWindows -PprojectVersion=${{ steps.version.outputs.version }}

      - name: Create build info
        shell: bash
        run: |
          {
            echo "project: sdrtrunk-radioresolve"
            echo "version: ${{ steps.version.outputs.version }}"
            echo "ref: $GITHUB_REF"
            echo "commit: $GITHUB_SHA"
            echo "build: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "upstream-base: a053315675e6764fe95c671139d796893c2b41a1"
          } > build/image/radioresolve_build_info.txt

      - name: Create checksums
        shell: bash
        run: |
          cd build/image
          sha256sum *.zip radioresolve_build_info.txt > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdrtrunk-radioresolve-${{ steps.version.outputs.version }}
          path: |
            build/image/*.zip
            build/image/radioresolve_build_info.txt
            build/image/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.release_tag }}
          name: RadioResolve sdrtrunk ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          body: |
            Unofficial RadioResolve modified build of sdrtrunk.

            Base upstream commit: `a053315675e6764fe95c671139d796893c2b41a1`

            See `RADIORESOLVE_CHANGES.md` and `docs/mp3-recording-metadata.md` for the modified recording metadata behavior.
          files: |
            build/image/*.zip
            build/image/radioresolve_build_info.txt
            build/image/SHA256SUMS.txt
